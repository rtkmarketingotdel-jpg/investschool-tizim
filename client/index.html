<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_SHORT%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>%BRAND_NAME%</title>
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <script>
      // Self-heal: if the page has no styles or the app did not mount (stale cache after a deploy), wipe caches and reload once.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          var styled = getComputedStyle(document.body).fontFamily.indexOf('Inter') !== -1 || getComputedStyle(document.body).backgroundColor !== 'rgba(0, 0, 0, 0)';
          if (root && root.childElementCount > 0 && styled) return;
          try { if (sessionStorage.getItem('self-heal')) return; sessionStorage.setItem('self-heal', '1'); } catch (e) {}
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }, 4000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
